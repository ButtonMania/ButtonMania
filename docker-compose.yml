services:
  # SERVER
  server:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "--configpath=/app/config.json",
        "--staticpath=/app/static",
        "--allowedorigins={*buttonmania.win,*buttonmania.top}",
        "--postgresurl=postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/buttonmania",
        "--redisaddress=redis:6379",
        "--redispassword=${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
        "--serverport=8080",
        "--telegramdonateton=UQAaTJqQ4bqy6xxCUV-MSWMsJulwLAP1Dyma5TaA0aGwWiEe",
        "--telegramdonateeth=0x0948A61328b3eCeDa37CC33907F30d4AC06C34Ed",
        "--telegramdonatexmr=48D2unYK1NhfzQusXnXsU6ZrXfPxfSXrKPwTxEknwJygeC6wTSBkWorbX55EYZbBMHZLdeG1GXL8N9Xs6KSFCdEQ5xgoTqg",
      ]
    ports:
      - 127.0.0.1:8080:8080
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - TG_WEBHOOK_URL=${TG_WEBHOOK_URL}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:?TG_BOT_TOKEN is required}
      - TG_APP_URL=${TG_APP_URL:?TG_APP_URL is required}
    networks:
      - buttonmania-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  # POSTGRES
  postgres:
    image: postgres:16-alpine
    user: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=buttonmania
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - buttonmania-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "buttonmania"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  # REDIS
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    networks:
      - buttonmania-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
networks:
  buttonmania-network:
volumes:
  redis-data:
  postgres-data:
