name: buttonmania-test
services:
  # POSTGRES
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=buttonmania_test
    ports:
      - 127.0.0.1:55432:5432
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 2s
      timeout: 3s
      retries: 15
  # REDIS
  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:56379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
