# TLS and routing are handled by the host's shared edge proxy (Traefik on the
# external `edge` network, deployed from its own repository). This stack only
# declares its routes via labels and must not publish 80/443 itself.
services:
  server:
    image: ghcr.io/buttonmania/buttonmania:latest
    restart: unless-stopped
    env_file: .env
    command:
      - "--configpath=/app/config.json"
      - "--staticpath=/app/static"
      - "--serverport=8888"
      - "--postgresurl=postgres://buttonmania:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/buttonmania"
      - "--redisaddress=redis:6379"
      - "--redispassword=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - "--redisdatabase=0"
    ports:
      # Loopback only: used by the deploy health check.
      - "127.0.0.1:8888:8888"
    networks:
      - buttonmania
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.services.buttonmania.loadbalancer.server.port=8888
      - traefik.http.routers.buttonmania.rule=Host(`buttonmania.win`) || Host(`buttonmania.top`) || Host(`maniagames.net`)
      - traefik.http.routers.buttonmania.entrypoints=websecure
      - traefik.http.routers.buttonmania.middlewares=buttonmania-compress
      - traefik.http.middlewares.buttonmania-compress.compress=true
      - traefik.http.routers.buttonmania-www.rule=Host(`www.buttonmania.win`) || Host(`www.buttonmania.top`) || Host(`www.maniagames.net`)
      - traefik.http.routers.buttonmania-www.entrypoints=websecure
      - traefik.http.routers.buttonmania-www.middlewares=buttonmania-www-to-apex
      - traefik.http.middlewares.buttonmania-www-to-apex.redirectregex.regex=^https://www\.([^/]+)(.*)
      - traefik.http.middlewares.buttonmania-www-to-apex.redirectregex.replacement=https://$${1}$${2}
      - traefik.http.middlewares.buttonmania-www-to-apex.redirectregex.permanent=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 128m

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buttonmania
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: buttonmania
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - buttonmania
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buttonmania -d buttonmania"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    networks:
      - buttonmania
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 96m

networks:
  buttonmania:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1450"
  edge:
    external: true

volumes:
  postgres-data:
  redis-data:
